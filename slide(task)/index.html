<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images Slide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button class="arrow left" onclick="prevImage()">❮</button>

        <div class="slider" onmouseover="pauseSlider()" onmouseout="resumeSlider()">
            <img  id="sliderImage" src="images/images1.jpg" alt="Slider Image">
        </div>

        <button class="arrow right" onclick="nextImage()">❯</button>

        <div class="dots" id="dotscontainer"></div>

        <div class="Zoom-control">
            <button onclick="zoomIn()">🔍Zoom In</button>
            <button onclick="zoomOut()">🔎 Zoom Out</button>
        </div>
    </div>
    
    <script src="script.js"></script>
    </body>
</html>
