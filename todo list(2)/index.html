<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
</head>
<body>
    <h2>To-Do-List</h2>
    <input id="task" type="text" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>
    <button onclick="searchTask()">Search</button>
    <button onclick="updateTask">Update</button>
    <p id="error" style="color: red;"></p>

    <h4>📝New Tasks</h4>
    <ul id="newlist"></ul>

    <h4>❌Not Done</h4>
    <ul id="notDoneList"></ul>

    <h4>✅Done</h4>
    <ul id="donelist"></ul>

    <h4>🗑️Deleted Tasks</h4>
    <ul id="deletedlist"></ul>

    <script>
        let tasks = [];

        function addTask()
        {
            const input = document.getElementById("task");
            const text = input.value.trim();
            const errors = document.getElementById("error");
            errors.innerText= "";

            if(text === "")
            {
                errors.innerText = "Please enter a task";
                return;
            }

            if(tasks.includes(text.toLowerCase())){
                errors.innerText = "Task already exists";
                return;
            }
             
            tasks.push(text.toLowerCase());
            input.value = "";

            const li = document.createElement("li");
            li.innerText = text;

            const donebtn = document.createElement("button");
            donebtn.innerText = "✔️";
            donebtn.onclick = function() {
                li.remove();
                moveToList(text, true);
            };

            const notdonebtn = document.createElement("button");
            notdonebtn.innerText = "❌";
            notdonebtn.onclick = function() {
                li.remove();
                moveToList(text, false);
            };

            li.appendChild(donebtn);
            li.appendChild(notdonebtn);
            document.getElementById("newlist").appendChild(li);
        }

        function moveToList(text, isdone)
        {
            const  li = document.createElement("li");
            li.innerText = text;

            const  deletebtn = document.createElement("button");
            deletebtn.innerText = "🗑️";
            deletebtn.onclick = function() {
                li.remove();
                shownInDeleted(text);
                tasks = tasks.filter(t => t !== text.toLowerCase());
            };
            li.appendChild(deletebtn);
        
            if(isdone)
            {
                li.style.textDecoration = "line-through";
                document.getElementById("donelist").appendChild(li);
            }
            else{
                document.getElementById("notDoneList").appendChild(li);
            }
            }

            function shownInDeleted(text){
                const li = document.createElement("li");
                li.innerText = text;
                document.getElementById("deletedlist").append(li);
            }
            
            function searchTask(){
                const input = document.getElementById("task");
                const searchText = input.value.trim().toLowerCase();
                const error = document.getElementById("error");
                errors.innerText = "";

                if (searchText === ""){
                    errors.innerText = "Enter task to search";
                    return;
                }

                if (tasks.includes(searchText)){
                    errors.innerText = "✅ Task Found";
                } else {
                    errors.innerText = "❌Task Not Found";
                }
            }

            function updateTask(){
                const input = document.getElementById("task");
                const newText = input.value.trim();
                const errors = document.getElementById("error");
                errors.innerText = "";

                if (newText ===  ""){
                    errors.innerText = "Enter new task name to update";
                    return;
                }

                const oldText = prompt("Enter the existing task to update:");

                if (!oldText || !tasks.includes(oldText.toLocaleLowerCase())){
                    errors.innerText = "Old task not found";
                    return;
                }

                tasks = tasks.map(t => (t === oldText.toLocaleLowerCase() ? newText.toLocaleLowerCase() : t));

                document.getElementById("newlist").innerHTML = "";
                document.getElementById("donelist").innerHTML = "";
                document.getElementById("notDoneList").innerHTML = "";

                tasks.forEach(t => {
                    const capitalText = t.charAt(0).toUpperCase() + t.slice(1);
                    const li = document.createElement("li");
                    l.innerText = capitalText;

                    const donebtn = document.createElement("button");
                    donebtn.innerText = "✔️";
                    donebtn.onclick = function(){
                        li.remove();
                        moveToList(capitalText, true);
                    };
                    
                    const notdonebtn = document.createElement("button");
                    notdonebtn.innerText = "❌";
                    notdonebtn.onclick = function(){
                        li.remove();
                        moveToList(capitalText, false);
                    };

                    li.appendChild(donebtn);
                    li.appendChild(notdonebtn);
                    document.getElementById("newlist").appendChild(li);

                });

                input.value = "";
                errors.innerText = "✅Task Updated";
            }
          </script>
</body>
</html>
